name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc => binaries run on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libgtk-3-dev libfuse2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb, AppImage, tarball
        run: ./packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\twm-bible-native.exe "dist\twm-bible-native-$version-windows-x64.exe"
          makensis /DVERSION=$version /DSRCDIR=$PWD /DEXE=$PWD\target\release\twm-bible-native.exe `
            /DOUTFILE=$PWD\dist\TWM-Bible-$version-windows-x64-setup.exe packaging\windows\installer.nsi
          Compress-Archive -Path target\release\twm-bible-native.exe, data, assets, LICENSE `
            -DestinationPath "dist\twm-bible-native-$version-windows-x64-portable.zip"
          Remove-Item "dist\twm-bible-native-$version-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build .app and .dmg
        run: ./packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: TWM-Bible-${{ steps.ver.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.thunderbyrdgrok.TWMBible.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: TWM-Bible-*.flatpak

  release:
    needs: [linux, windows, macos, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Release notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-body.md; else echo "TWM Bible ${GITHUB_REF_NAME}" > release-body.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: TWM Bible ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/*
          generate_release_notes: true
